<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Pia 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" media="print" onload="this.media='all'">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --rose: #c4607a; --rose-light: #f2c4d0; --rose-dark: #9a3f59;
  --cream: #fdf8f3; --warm: #f7ede2; --dark: #1e1520; --muted: #8a7080;
  --correct: #3d7a58; --correct-bg: #e8f5ee; --wrong-bg: #fdf0f2;
  --shadow-sm: 0 2px 8px rgba(30,21,32,0.07), 0 1px 2px rgba(30,21,32,0.05);
  --shadow-md: 0 8px 24px rgba(30,21,32,0.10), 0 2px 6px rgba(30,21,32,0.06);
  --shadow-lg: 0 20px 60px rgba(30,21,32,0.14), 0 4px 16px rgba(30,21,32,0.08);
  --shadow-xl: 0 32px 80px rgba(30,21,32,0.18), 0 8px 24px rgba(30,21,32,0.10);
}
html { scroll-behavior: smooth; }
body { font-family: 'Plus Jakarta Sans', Georgia, sans-serif; background: var(--cream); color: var(--dark); min-height: 100vh; overflow-x: hidden; }

/* HERO */
.hero { position: relative; width: 100%; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 3rem 2rem; overflow: hidden; }
.hero-bg { position: absolute; inset: 0; z-index: 0; background: radial-gradient(ellipse 80% 60% at 50% 0%, #fce8ef 0%, #fdf4ec 50%, #f5e9f8 100%); }
.hero-bg::after { content: ''; position: absolute; inset: 0; background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='30' cy='30' r='2' fill='%23c4607a' fill-opacity='0.04'/%3E%3C/svg%3E"); }

.photo-strip { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.polaroid { position: absolute; background: white; padding: 10px 10px 28px; border-radius: 4px; box-shadow: var(--shadow-lg); transition: transform 0.4s cubic-bezier(.34,1.56,.64,1), box-shadow 0.3s ease; pointer-events: auto; cursor: default; }
.polaroid:hover { box-shadow: var(--shadow-xl); z-index: 10; }
.polaroid img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 2px; }
.polaroid-caption { position: absolute; bottom: 7px; left: 0; right: 0; text-align: center; font-size: 9px; letter-spacing: 0.08em; color: #b0a0a8; }
.pol-1 { width: 160px; height: 210px; top: 6%; left: -20px; transform: rotate(-7deg); opacity: 0.85; }
.pol-1:hover { transform: rotate(-3deg) scale(1.05); }
.pol-2 { width: 140px; height: 190px; bottom: 10%; right: -15px; transform: rotate(6deg); opacity: 0.85; }
.pol-2:hover { transform: rotate(2deg) scale(1.05); }
.pol-3 { width: 120px; height: 162px; top: 60%; left: 25px; transform: rotate(4deg); opacity: 0.7; }
.pol-3:hover { transform: rotate(1deg) scale(1.05); }

.hero-content { position: relative; z-index: 2; max-width: 520px; }
.hero-badge { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--rose-dark); background: rgba(255,255,255,0.75); border: 1px solid rgba(196,96,122,0.2); padding: 7px 18px; border-radius: 99px; margin-bottom: 1.8rem; backdrop-filter: blur(8px); box-shadow: var(--shadow-sm); }
.hero-badge::before, .hero-badge::after { content: '✦'; font-size: 8px; }
.hero h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(3.5rem, 12vw, 7rem); line-height: 0.95; color: var(--dark); margin-bottom: 1.2rem; }
.hero h1 em { font-style: italic; color: var(--rose); display: block; }
.hero h1 .name { font-weight: 700; font-size: 1.15em; }
.hero-sub { font-size: 15px; color: var(--muted); margin-bottom: 2.5rem; line-height: 1.7; }
.start-btn { display: inline-flex; align-items: center; gap: 10px; background: linear-gradient(135deg, var(--rose) 0%, var(--rose-dark) 100%); color: white; font-family: inherit; font-size: 15px; font-weight: 600; padding: 16px 40px; border-radius: 99px; border: none; cursor: pointer; box-shadow: 0 8px 32px rgba(196,96,122,0.4); transition: transform 0.2s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s; }
.start-btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 16px 48px rgba(196,96,122,0.45); }
.start-btn:active { transform: scale(0.97); }
.arrow { transition: transform 0.2s; }
.start-btn:hover .arrow { transform: translateX(4px); }

/* QUIZ */
.quiz-section { display: none; max-width: 680px; margin: 0 auto; padding: 3rem 1.5rem 6rem; background: linear-gradient(180deg, #fdf8f3 0%, #f9f0f5 100%); min-height: 100vh; }
.progress-wrap { margin-bottom: 3rem; }
.progress-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.progress-num { font-size: 13px; font-weight: 600; color: var(--rose); }
.progress-pts { font-size: 13px; color: var(--muted); }
.progress-track { height: 6px; background: rgba(30,21,32,0.08); border-radius: 99px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(30,21,32,0.1); }
.progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--rose-light), var(--rose)); border-radius: 99px; transition: width 0.5s cubic-bezier(.4,0,.2,1); }

.question-block { display: none; }
.question-block.active { display: block; animation: slideUp 0.45s cubic-bezier(.4,0,.2,1); }
@keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }

.q-card { background: #fff; border-radius: 28px; box-shadow: var(--shadow-lg); padding: 2rem 2rem 1.75rem; }
.q-meta { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--rose); background: #fdf0f4; padding: 5px 12px; border-radius: 99px; margin-bottom: 1.2rem; }
.q-text { font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(20px, 4vw, 26px); line-height: 1.35; color: var(--dark); margin-bottom: 1.8rem; font-weight: 600; }
.options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 500px) { .options-grid { grid-template-columns: 1fr; } }

.opt-btn { display: flex; align-items: center; gap: 12px; padding: 13px 16px; background: var(--cream); border: 1.5px solid rgba(30,21,32,0.08); border-radius: 20px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; color: var(--dark); text-align: left; box-shadow: var(--shadow-sm); transition: all 0.18s cubic-bezier(.4,0,.2,1); }
.opt-btn:hover:not(:disabled) { border-color: var(--rose-light); background: #fff5f8; box-shadow: 0 6px 20px rgba(196,96,122,0.15); transform: translateY(-2px); }
.opt-btn:disabled { cursor: default; }
.opt-letter { width: 30px; height: 30px; border-radius: 10px; background: white; border: 1px solid rgba(30,21,32,0.1); color: var(--muted); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: inset 0 1px 3px rgba(30,21,32,0.06); }
.opt-btn.correct { background: var(--correct-bg); border-color: var(--correct); box-shadow: 0 0 0 3px rgba(61,122,88,0.12), var(--shadow-md); animation: correctPulse 0.5s ease; }
.opt-btn.correct .opt-letter { background: var(--correct); color: white; border-color: var(--correct); }
.opt-btn.wrong { background: var(--wrong-bg); border-color: #d45; opacity: 0.55; }
.opt-btn.wrong .opt-letter { background: #d45; color: white; border-color: #d45; }
@keyframes correctPulse { 0% { transform: scale(1); } 40% { transform: scale(1.03); } 70% { transform: scale(0.99); } 100% { transform: scale(1); } }

.answer-reveal { display: none; margin-top: 1.2rem; padding: 14px 18px; background: linear-gradient(135deg, #fdf8fc, #f8f4fd); border: 1px solid rgba(196,96,122,0.12); border-radius: 20px; font-size: 13.5px; color: var(--muted); line-height: 1.75; animation: fadeReveal 0.35s ease; }
.answer-reveal strong { color: var(--dark); font-weight: 600; }
@keyframes fadeReveal { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.card-footer { display: flex; justify-content: flex-end; margin-top: 1.5rem; }
.next-btn { display: none; background: linear-gradient(135deg, var(--dark) 0%, #3d2a42 100%); color: white; font-family: inherit; font-size: 14px; font-weight: 600; padding: 13px 28px; border: none; border-radius: 99px; cursor: pointer; box-shadow: 0 6px 20px rgba(30,21,32,0.25); transition: transform 0.2s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s; }
.next-btn:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 12px 32px rgba(30,21,32,0.3); }

/* RESULT */
.result-section { display: none; max-width: 600px; margin: 0 auto; padding: 5rem 1.5rem; text-align: center; min-height: 100vh; background: linear-gradient(180deg, #fdf8f3 0%, #f5edf5 100%); }
.result-photos { display: flex; justify-content: center; gap: 0; margin-bottom: 3rem; }
.result-polaroid { background: white; padding: 8px 8px 24px; border-radius: 3px; box-shadow: var(--shadow-xl); width: 100px; height: 135px; transition: transform 0.4s ease; }
.result-polaroid:nth-child(1) { transform: rotate(-6deg) translateX(12px); z-index: 1; }
.result-polaroid:nth-child(2) { transform: translateY(-12px); z-index: 3; width: 110px; height: 148px; }
.result-polaroid:nth-child(3) { transform: rotate(6deg) translateX(-12px); z-index: 1; }
.result-polaroid:hover { transform: rotate(0deg) translateY(-8px) scale(1.08) !important; z-index: 10; }
.result-polaroid img { width: 100%; height: 100%; object-fit: cover; display: block; }
.result-stars { display: flex; justify-content: center; gap: 6px; margin-bottom: 1rem; }
.star { font-size: 28px; opacity: 0; animation: starPop 0.4s cubic-bezier(.34,1.56,.64,1) forwards; }
.star:nth-child(1){animation-delay:.1s} .star:nth-child(2){animation-delay:.2s} .star:nth-child(3){animation-delay:.3s} .star:nth-child(4){animation-delay:.4s} .star:nth-child(5){animation-delay:.5s}
.star.lit { color: #f5a623; } .star.dim { color: #e0d0d8; }
@keyframes starPop { from { opacity:0; transform: scale(0) rotate(-20deg); } to { opacity:1; transform: scale(1) rotate(0); } }
.result-score { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 96px; font-weight: 700; color: var(--rose); line-height: 1; animation: countUp 0.6s ease; }
@keyframes countUp { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.result-denom { font-size: 20px; color: var(--muted); margin-bottom: 0.5rem; }
.result-divider { width: 48px; height: 3px; background: linear-gradient(90deg, var(--rose-light), var(--rose)); border-radius: 99px; margin: 1.5rem auto; }
.result-msg { font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(22px, 4.5vw, 30px); font-weight: 600; color: var(--dark); margin-bottom: 0.8rem; line-height: 1.3; }
.result-sub { font-size: 14px; color: var(--muted); margin-bottom: 3rem; line-height: 1.8; max-width: 400px; margin-left: auto; margin-right: auto; }
.restart-btn { display: inline-flex; align-items: center; gap: 8px; border: 2px solid var(--rose); color: var(--rose); background: transparent; font-family: inherit; font-size: 14px; font-weight: 600; padding: 13px 32px; border-radius: 99px; cursor: pointer; box-shadow: 0 4px 16px rgba(196,96,122,0.15); transition: all 0.2s ease; }
.restart-btn:hover { background: var(--rose); color: white; box-shadow: 0 8px 28px rgba(196,96,122,0.35); transform: translateY(-2px); }
.confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }
</style>
</head>
<body>

<section class="hero" id="hero">
  <div class="hero-bg"></div>
  <div class="photo-strip">
    <div class="polaroid pol-1"><img src="dubai.jpg" alt="Pia in Dubai"><div class="polaroid-caption">Dubai ✦</div></div>
    <div class="polaroid pol-2"><img src="tiara.jpg" alt="Pia mit Tiara"><div class="polaroid-caption">Princess ✦</div></div>
    <div class="polaroid pol-3"><img src="puppe.jpg" alt="Pia &amp; Sophie"><div class="polaroid-caption">Pia &amp; Sophie ✦</div></div>
  </div>
  <div class="hero-content">
    <div class="hero-badge">17. Mai 2026 &nbsp;&bull;&nbsp; Sweet Sixteen</div>
    <h1>Happy<br><em>Birthday</em><span class="name">Pia!</span></h1>
    <p class="hero-sub">Kennst du Pia wirklich?<br>10 Fragen — ehrlich zählen.</p>
    <button class="start-btn" id="start-btn-main">Quiz starten <span class="arrow">→</span></button>
  </div>
</section>

<section class="quiz-section" id="quiz">
  <div class="progress-wrap">
    <div class="progress-top">
      <span class="progress-num" id="progress-label">Frage 1 von 10</span>
      <span class="progress-pts" id="score-label">0 Punkte</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </div>
  <div id="questions-container"></div>
</section>

<section class="result-section" id="result">
  <canvas class="confetti-canvas" id="confetti-canvas"></canvas>
  <div class="result-photos">
    <div class="result-polaroid"><img src="puppe.jpg" alt=""></div>
    <div class="result-polaroid"><img src="tiara.jpg" alt=""></div>
    <div class="result-polaroid"><img src="dubai.jpg" alt=""></div>
  </div>
  <div class="result-stars" id="result-stars"></div>
  <div class="result-score" id="result-score">0</div>
  <div class="result-denom">von 6 Punkten</div>
  <div class="result-divider"></div>
  <div class="result-msg" id="result-msg"></div>
  <p class="result-sub" id="result-sub"></p>
  <button class="restart-btn" id="restart-btn-main">↺ Nochmal spielen</button>
</section>

<script>
var questions = [
  { q: "Pia wurde an einem ganz besonderen Wochentag geboren. Welchem?", opts: ["Sonntag","Montag","Freitag","Mittwoch"], correct: 1, explain: "<strong>Montag — Pfingstmontag!</strong> Pia kam als Feiertags-Edition auf die Welt. Österreich hatte frei. Zufall? Wir glauben nicht." },
  { q: "Zu welcher Uhrzeit wurde Pia geboren?", opts: ["12:00 Uhr mittags","21:15 Uhr abends","5:37 Uhr früh","8:02 Uhr morgens"], correct: 2, explain: "<strong>5:37 Uhr!</strong> Mitten in der Nacht — kein Wunder, dass sie heute noch am liebsten ausschläft." },
  { q: "Pia hat ein treues Kuscheltier. Was ist es?", opts: ["Ein Hase","Ein Bär","Ein Einhorn","Ein Affe"], correct: 3, explain: "<strong>Ein Affe!</strong> Er hat schon mehr Geburtstage überlebt als mancher Gast hier im Raum." },
  { q: "Wie alt wird Pia heute?", opts: ["14","15","16","17"], correct: 2, explain: "<strong>16 — Sweet Sixteen!</strong> Offiziell alt genug für Moped, Radler und noch mehr Verantwortung." },
  { q: "Welche Schuhgröße hat Pia?", opts: ["37","38","39","41"], correct: 2, explain: "<strong>Größe 39!</strong> Solide Mitte — weder zu klein für die großen Abenteuer, noch zu groß für die Tanzfläche." },
  { q: "Wenn Pia um 5:37 Uhr geboren wurde — wie viele Minuten nach Mitternacht war das?", opts: ["237 Minuten","300 Minuten","337 Minuten","357 Minuten"], correct: 2, explain: "<strong>337 Minuten</strong> — 5 x 60 + 37 = 337. Wer das im Kopf gerechnet hat, bekommt einen Bonuspunkt fürs Nerdsein." }
];

var score = 0;
var answered = false;

function startQuiz() {
  document.getElementById('hero').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  buildQuestions();
  showQuestion(0);
}

function buildQuestions() {
  var c = document.getElementById('questions-container');
  c.innerHTML = '';
  var letters = ['A','B','C','D'];
  for (var i = 0; i < questions.length; i++) {
    var q = questions[i];
    var optsHtml = '';
    for (var j = 0; j < q.opts.length; j++) {
      optsHtml += '<button class="opt-btn" data-qidx="' + i + '" data-oidx="' + j + '">' +
        '<span class="opt-letter">' + letters[j] + '</span><span>' + q.opts[j] + '</span></button>';
    }
    var isLast = (i === questions.length - 1);
    c.innerHTML += '<div class="question-block" id="q' + i + '">' +
      '<div class="q-card">' +
      '<div class="q-meta">Frage ' + (i+1) + ' von ' + questions.length + '</div>' +
      '<div class="q-text">' + q.q + '</div>' +
      '<div class="options-grid">' + optsHtml + '</div>' +
      '<div class="answer-reveal" id="reveal' + i + '">' + q.explain + '</div>' +
      '<div class="card-footer"><button class="next-btn" id="next' + i + '" data-nextidx="' + i + '">' +
      (isLast ? 'Ergebnis anzeigen →' : 'Nächste Frage →') + '</button></div>' +
      '</div></div>';
  }
}

function showQuestion(idx) {
  var blocks = document.querySelectorAll('.question-block');
  for (var i = 0; i < blocks.length; i++) blocks[i].classList.remove('active');
  document.getElementById('q' + idx).classList.add('active');
  document.getElementById('progress-fill').style.width = (idx / questions.length * 100) + '%';
  document.getElementById('progress-label').textContent = 'Frage ' + (idx+1) + ' von ' + questions.length;
  answered = false;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function selectOption(btn, qIdx, oIdx) {
  if (answered) return;
  answered = true;
  var q = questions[qIdx];
  var allBtns = document.querySelectorAll('[data-qidx="' + qIdx + '"]');
  for (var i = 0; i < allBtns.length; i++) allBtns[i].disabled = true;
  if (oIdx === q.correct) {
    btn.classList.add('correct');
    score++;
    document.getElementById('score-label').textContent = score + (score === 1 ? ' Punkt' : ' Punkte');
  } else {
    btn.classList.add('wrong');
    allBtns[q.correct].classList.add('correct');
  }
  document.getElementById('reveal' + qIdx).style.display = 'block';
  document.getElementById('next' + qIdx).style.display = 'inline-block';
}

function nextQuestion(qIdx) {
  if (qIdx < questions.length - 1) showQuestion(qIdx + 1);
  else showResult();
}

function showResult() {
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
  var el = document.getElementById('result-score');
  var displayed = 0;
  var interval = setInterval(function() {
    if (displayed >= score) { clearInterval(interval); return; }
    displayed++;
    el.textContent = displayed;
  }, 120);
  var starsEl = document.getElementById('result-stars');
  var litStars = Math.round((score / questions.length) * 5);
  starsEl.innerHTML = '';
  for (var i = 0; i < 5; i++) {
    var s = document.createElement('span');
    s.className = 'star ' + (i < litStars ? 'lit' : 'dim');
    s.textContent = '★';
    starsEl.appendChild(s);
  }
  var msgs = [
    { max:2,  msg:"Du kennst Pia erst seit heute.",        sub:"Aber immerhin bist du hier! Das zählt auch." },
    { max:4,  msg:"Guter Freund — aber da geht noch was.", sub:"Mit etwas mehr Aufmerksamkeit nächstes Jahr klappt es besser." },
    { max:5,  msg:"Echter Pia-Fan!",                       sub:"Du hast gut aufgepasst. Pia ist stolz auf dich." },
    { max:6,  msg:"Perfekt! 6 von 6.",                     sub:"Entweder du bist ihre Mutter — oder ein Stalker. Beides ist irgendwie rührend." }
  ];
  var m = msgs[0];
  for (var i = 0; i < msgs.length; i++) { if (score <= msgs[i].max) { m = msgs[i]; break; } }
  document.getElementById('result-msg').textContent = m.msg;
  document.getElementById('result-sub').textContent = m.sub;
  if (score >= 5) launchConfetti();
}

function restartQuiz() {
  score = 0;
  document.getElementById('result').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  document.getElementById('score-label').textContent = '0 Punkte';
  buildQuestions();
  showQuestion(0);
}

function launchConfetti() {
  var canvas = document.getElementById('confetti-canvas');
  var ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  var colors = ['#c4607a','#f2c4d0','#e8a0b0','#fdf6ef','#9a3f59','#f7c5d5','#fff'];
  var pieces = [];
  for (var i = 0; i < 120; i++) {
    pieces.push({ x: Math.random()*canvas.width, y: Math.random()*-canvas.height, w: Math.random()*10+5, h: Math.random()*6+3, color: colors[Math.floor(Math.random()*colors.length)], rot: Math.random()*Math.PI*2, rotV: (Math.random()-0.5)*0.12, vy: Math.random()*3+2, vx: (Math.random()-0.5)*2 });
  }
  var frame = 0;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var i = 0; i < pieces.length; i++) {
      var p = pieces[i];
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
      p.y += p.vy; p.x += p.vx; p.rot += p.rotV;
    }
    frame++;
    if (frame < 180) requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  draw();
}

// Wire up all events
document.getElementById('start-btn-main').addEventListener('click', startQuiz);
document.getElementById('restart-btn-main').addEventListener('click', restartQuiz);
document.addEventListener('click', function(e) {
  var btn = e.target.closest('.opt-btn');
  var nxt = e.target.closest('.next-btn');
  if (btn && !btn.disabled) selectOption(btn, parseInt(btn.dataset.qidx), parseInt(btn.dataset.oidx));
  if (nxt) nextQuestion(parseInt(nxt.dataset.nextidx));
});
</script>
</body>
</html>
