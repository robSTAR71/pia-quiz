<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Pia 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"></noscript>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --rose:       #c4607a;
  --rose-light: #f2c4d0;
  --rose-dark:  #9a3f59;
  --cream:      #fdf8f3;
  --warm:       #f7ede2;
  --dark:       #1e1520;
  --muted:      #8a7080;
  --correct:    #3d7a58;
  --correct-bg: #e8f5ee;
  --wrong-bg:   #fdf0f2;
  --card-bg:    #ffffff;
  --shadow-sm:  0 2px 8px rgba(30,21,32,0.07), 0 1px 2px rgba(30,21,32,0.05);
  --shadow-md:  0 8px 24px rgba(30,21,32,0.10), 0 2px 6px rgba(30,21,32,0.06);
  --shadow-lg:  0 20px 60px rgba(30,21,32,0.14), 0 4px 16px rgba(30,21,32,0.08);
  --shadow-xl:  0 32px 80px rgba(30,21,32,0.18), 0 8px 24px rgba(30,21,32,0.10);
  --r-sm: 12px;
  --r-md: 20px;
  --r-lg: 28px;
  --r-xl: 36px;
}

html { scroll-behavior: smooth; }
body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--cream); color: var(--dark); min-height: 100vh; overflow-x: hidden; }

/* ===================== HERO ===================== */
.hero {
  position: relative; width: 100%; min-height: 100vh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 3rem 2rem; overflow: hidden;
}

.hero-bg {
  position: absolute; inset: 0; z-index: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 0%, #fce8ef 0%, #fdf4ec 50%, #f5e9f8 100%);
}

.hero-bg::after {
  content: '';
  position: absolute; inset: 0;
  background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c4607a' fill-opacity='0.03'%3E%3Ccircle cx='30' cy='30' r='2'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
}

/* Polaroid photos */
.photo-strip { position: absolute; inset: 0; z-index: 1; pointer-events: none; }

.polaroid {
  position: absolute;
  background: white;
  padding: 10px 10px 28px;
  border-radius: 4px;
  box-shadow: var(--shadow-lg);
  transition: transform 0.4s cubic-bezier(.34,1.56,.64,1), box-shadow 0.3s ease;
  pointer-events: auto;
  cursor: default;
}
.polaroid:hover {
  box-shadow: var(--shadow-xl);
  z-index: 10;
}
.polaroid img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 2px; }
.polaroid-caption { position: absolute; bottom: 7px; left: 0; right: 0; text-align: center; font-size: 9px; letter-spacing: 0.08em; color: #b0a0a8; font-family: 'Plus Jakarta Sans', sans-serif; }

.pol-1 { width: 160px; height: 210px; top: 6%; left: -20px; transform: rotate(-7deg); opacity: 0.85; }
.pol-1:hover { transform: rotate(-3deg) scale(1.05); }
.pol-2 { width: 140px; height: 190px; bottom: 10%; right: -15px; transform: rotate(6deg); opacity: 0.85; }
.pol-2:hover { transform: rotate(2deg) scale(1.05); }
.pol-3 { width: 120px; height: 162px; top: 60%; left: 25px; transform: rotate(4deg); opacity: 0.7; }
.pol-3:hover { transform: rotate(1deg) scale(1.05); }

.hero-content { position: relative; z-index: 2; max-width: 520px; }

.hero-badge {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--rose-dark);
  background: rgba(255,255,255,0.75);
  border: 1px solid rgba(196,96,122,0.2);
  padding: 7px 18px; border-radius: 99px; margin-bottom: 1.8rem;
  backdrop-filter: blur(8px);
  box-shadow: var(--shadow-sm);
}
.hero-badge::before { content: '✦'; font-size: 8px; }
.hero-badge::after  { content: '✦'; font-size: 8px; }

.hero h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(3.5rem, 12vw, 7rem);
  line-height: 0.95; color: var(--dark); margin-bottom: 1.2rem;
  letter-spacing: -0.01em;
}
.hero h1 em { font-style: italic; color: var(--rose); display: block; }
.hero h1 .name { font-weight: 700; font-size: 1.15em; }

.hero-sub {
  font-size: 15px; color: var(--muted); margin-bottom: 2.5rem;
  line-height: 1.7; font-weight: 400;
}

.start-btn {
  display: inline-flex; align-items: center; gap: 10px;
  background: linear-gradient(135deg, var(--rose) 0%, var(--rose-dark) 100%);
  color: white; font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 15px; font-weight: 600; padding: 16px 40px;
  border-radius: 99px; border: none; cursor: pointer;
  box-shadow: 0 8px 32px rgba(196,96,122,0.4), 0 2px 8px rgba(196,96,122,0.2);
  transition: transform 0.2s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s ease;
  letter-spacing: 0.02em;
}
.start-btn:hover {
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 16px 48px rgba(196,96,122,0.45), 0 4px 12px rgba(196,96,122,0.25);
}
.start-btn:active { transform: scale(0.97); }
.start-btn .arrow { transition: transform 0.2s ease; }
.start-btn:hover .arrow { transform: translateX(4px); }

/* ===================== QUIZ SECTION ===================== */
.quiz-section {
  display: none; max-width: 680px; margin: 0 auto;
  padding: 3rem 1.5rem 6rem;
  background: linear-gradient(180deg, #fdf8f3 0%, #f9f0f5 100%);
  min-height: 100vh;
}

/* Progress */
.progress-wrap { margin-bottom: 3rem; }
.progress-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.progress-num { font-size: 13px; font-weight: 600; color: var(--rose); }
.progress-pts { font-size: 13px; color: var(--muted); }
.progress-track {
  height: 6px; background: rgba(30,21,32,0.08);
  border-radius: 99px; overflow: hidden;
  box-shadow: inset 0 1px 3px rgba(30,21,32,0.1);
}
.progress-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--rose-light), var(--rose));
  border-radius: 99px;
  transition: width 0.5s cubic-bezier(.4,0,.2,1);
  position: relative; overflow: hidden;
}
.progress-fill::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.4) 50%, transparent 100%);
  animation: shimmer 2s infinite;
}
@keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(200%); } }

/* Question card */
.question-block { display: none; }
.question-block.active { display: block; animation: slideUp 0.45s cubic-bezier(.4,0,.2,1); }

@keyframes slideUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

.q-card {
  background: var(--card-bg);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-lg);
  padding: 2rem 2rem 1.75rem;
  margin-bottom: 0;
}

.q-meta {
  display: inline-block;
  font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--rose); background: #fdf0f4;
  padding: 5px 12px; border-radius: 99px; margin-bottom: 1.2rem;
}

.q-text {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(20px, 4vw, 26px);
  line-height: 1.35; color: var(--dark); margin-bottom: 1.8rem;
  font-weight: 600;
}

.options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 0; }
@media (max-width: 500px) { .options-grid { grid-template-columns: 1fr; } }

.opt-btn {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 16px;
  background: var(--cream);
  border: 1.5px solid rgba(30,21,32,0.08);
  border-radius: var(--r-md);
  cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 14px; font-weight: 500; color: var(--dark);
  text-align: left;
  box-shadow: var(--shadow-sm);
  transition: all 0.18s cubic-bezier(.4,0,.2,1);
}
.opt-btn:hover:not(:disabled) {
  border-color: var(--rose-light);
  background: #fff5f8;
  box-shadow: 0 6px 20px rgba(196,96,122,0.15), 0 2px 6px rgba(196,96,122,0.08);
  transform: translateY(-2px);
}
.opt-btn:active:not(:disabled) { transform: scale(0.97); }
.opt-btn:disabled { cursor: default; }

.opt-letter {
  width: 30px; height: 30px; border-radius: 10px;
  background: white; border: 1px solid rgba(30,21,32,0.1);
  color: var(--muted); font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s ease;
  box-shadow: inset 0 1px 3px rgba(30,21,32,0.06);
}

.opt-btn.correct {
  background: var(--correct-bg);
  border-color: var(--correct);
  box-shadow: 0 0 0 3px rgba(61,122,88,0.12), var(--shadow-md);
  animation: correctPulse 0.5s ease;
}
.opt-btn.correct .opt-letter { background: var(--correct); color: white; border-color: var(--correct); box-shadow: none; }

.opt-btn.wrong {
  background: var(--wrong-bg); border-color: #d45; opacity: 0.55;
}
.opt-btn.wrong .opt-letter { background: #d45; color: white; border-color: #d45; box-shadow: none; }

@keyframes correctPulse {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.03); }
  70%  { transform: scale(0.99); }
  100% { transform: scale(1); }
}

/* Answer reveal */
.answer-reveal {
  display: none;
  margin-top: 1.2rem;
  padding: 14px 18px;
  background: linear-gradient(135deg, #fdf8fc 0%, #f8f4fd 100%);
  border: 1px solid rgba(196,96,122,0.12);
  border-radius: var(--r-md);
  font-size: 13.5px; color: var(--muted); line-height: 1.75;
  box-shadow: inset 0 1px 4px rgba(30,21,32,0.04);
  animation: fadeReveal 0.35s ease;
}
.answer-reveal strong { color: var(--dark); font-weight: 600; }
@keyframes fadeReveal { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.card-footer { display: flex; justify-content: flex-end; margin-top: 1.5rem; }

.next-btn {
  display: none;
  background: linear-gradient(135deg, var(--dark) 0%, #3d2a42 100%);
  color: white; font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 14px; font-weight: 600;
  padding: 13px 28px; border: none; border-radius: 99px;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(30,21,32,0.25), 0 2px 6px rgba(30,21,32,0.12);
  transition: transform 0.2s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s ease;
  letter-spacing: 0.02em;
}
.next-btn:hover {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 12px 32px rgba(30,21,32,0.3);
}
.next-btn:active { transform: scale(0.97); }

/* ===================== RESULT ===================== */
.result-section {
  display: none; max-width: 600px; margin: 0 auto;
  padding: 5rem 1.5rem 5rem; text-align: center;
  min-height: 100vh;
  background: linear-gradient(180deg, #fdf8f3 0%, #f5edf5 100%);
}

.result-photos {
  display: flex; justify-content: center; gap: 0; margin-bottom: 3rem;
  perspective: 600px;
}
.result-polaroid {
  background: white; padding: 8px 8px 24px;
  border-radius: 3px;
  box-shadow: var(--shadow-xl);
  width: 100px; height: 135px;
  transition: transform 0.4s ease;
}
.result-polaroid:nth-child(1) { transform: rotate(-6deg) translateX(12px); z-index: 1; }
.result-polaroid:nth-child(2) { transform: translateY(-12px); z-index: 3; width: 110px; height: 148px; }
.result-polaroid:nth-child(3) { transform: rotate(6deg) translateX(-12px); z-index: 1; }
.result-polaroid:hover { transform: rotate(0deg) translateY(-8px) scale(1.08) !important; z-index: 10; }
.result-polaroid img { width: 100%; height: 100%; object-fit: cover; border-radius: 1px; display: block; }

.result-stars { display: flex; justify-content: center; gap: 6px; margin-bottom: 1rem; }
.star {
  font-size: 28px; opacity: 0;
  animation: starPop 0.4s cubic-bezier(.34,1.56,.64,1) forwards;
}
.star:nth-child(1) { animation-delay: 0.1s; }
.star:nth-child(2) { animation-delay: 0.2s; }
.star:nth-child(3) { animation-delay: 0.3s; }
.star:nth-child(4) { animation-delay: 0.4s; }
.star:nth-child(5) { animation-delay: 0.5s; }
.star.lit { color: #f5a623; }
.star.dim { color: #e0d0d8; }
@keyframes starPop { from { opacity:0; transform: scale(0) rotate(-20deg); } to { opacity:1; transform: scale(1) rotate(0deg); } }

.result-score-wrap { margin-bottom: 0.5rem; }
.result-score {
  font-family: 'Cormorant Garamond', serif;
  font-size: 96px; font-weight: 700; color: var(--rose); line-height: 1;
  animation: countUp 0.6s ease;
}
@keyframes countUp { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.result-denom { font-size: 20px; color: var(--muted); margin-bottom: 0.5rem; }

.result-divider {
  width: 48px; height: 3px;
  background: linear-gradient(90deg, var(--rose-light), var(--rose));
  border-radius: 99px; margin: 1.5rem auto;
}

.result-msg {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(22px, 4.5vw, 30px);
  font-weight: 600; color: var(--dark); margin-bottom: 0.8rem; line-height: 1.3;
}
.result-sub { font-size: 14px; color: var(--muted); margin-bottom: 3rem; line-height: 1.8; max-width: 400px; margin-left: auto; margin-right: auto; }

.restart-btn {
  display: inline-flex; align-items: center; gap: 8px;
  border: 2px solid var(--rose); color: var(--rose);
  background: transparent; font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 14px; font-weight: 600; padding: 13px 32px;
  border-radius: 99px; cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 4px 16px rgba(196,96,122,0.15);
}
.restart-btn:hover {
  background: var(--rose); color: white;
  box-shadow: 0 8px 28px rgba(196,96,122,0.35);
  transform: translateY(-2px);
}

/* Confetti */
.confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }
</style>
</head>

<script>
document.addEventListener("DOMContentLoaded", function() {

const questions = [
  { q: "Pia wurde an einem ganz besonderen Wochentag geboren. Welchem?", opts: ["Sonntag","Montag","Freitag","Mittwoch"], correct: 1, explain: "<strong>Montag — Pfingstmontag!</strong> Pia kam als Feiertags-Edition auf die Welt. Österreich hatte frei. Zufall? Wir glauben nicht." },
  { q: "Zu welcher Uhrzeit wurde Pia geboren?", opts: ["12:00 Uhr mittags","21:15 Uhr abends","5:37 Uhr früh","8:02 Uhr morgens"], correct: 2, explain: "<strong>5:37 Uhr!</strong> Mitten in der Nacht — kein Wunder, dass sie heute noch am liebsten ausschläft." },
  { q: "Pia hat ein treues Kuscheltier. Was ist es?", opts: ["Ein Hase","Ein Bär","Ein Einhorn","Ein Affe"], correct: 3, explain: "<strong>Ein Affe!</strong> Er hat schon mehr Geburtstage überlebt als mancher Gast hier im Raum." },
  { q: "Wie alt wird Pia heute?", opts: ["14","15","16","17"], correct: 2, explain: "<strong>16 — Sweet Sixteen!</strong> Offiziell alt genug für Moped, Radler und noch mehr Verantwortung." },
  { q: "Welche Schuhgröße hat Pia?", opts: ["37","38","39","41"], correct: 2, explain: "<strong>Größe 39!</strong> Solide Mitte — weder zu klein für die großen Abenteuer, noch zu groß für die Tanzfläche." },
  { q: "Was bedeutet der Name „Pia"?", opts: ["Die Mutige","Die Fromme / Gottesfürchtige","Die Kluge","Die Fröhliche"], correct: 1, explain: "<strong>Die Fromme</strong> — lateinisch \"pius/pia\". Ob das wirklich immer zutrifft, darf das Geburtstagskind selbst beurteilen." },
  { q: "Pfingstmontag ist ein gesetzlicher Feiertag. Was wird an Pfingsten gefeiert?", opts: ["Christi Himmelfahrt","Die Auferstehung Jesu","Die Ausgießung des Heiligen Geistes","Den Geburtstag von Pia"], correct: 2, explain: "<strong>Die Ausgießung des Heiligen Geistes.</strong> Zumindest offiziell. Inoffiziell feiert Österreich natürlich Pias Geburtstag." },
  { q: "Wenn Pia um 5:37 Uhr geboren wurde — wie viele Minuten nach Mitternacht war das?", opts: ["237 Minuten","300 Minuten","337 Minuten","357 Minuten"], correct: 2, explain: "<strong>337 Minuten</strong> — 5 × 60 + 37 = 337. Wer das im Kopf gerechnet hat, bekommt einen Bonuspunkt fürs Nerdsein." },
  { q: "Wie viele Tage lagen zwischen dem 16. Mai 2026 und Pias Geburtstag am 17. Mai 2010?", opts: ["4.200 Tage","5.000 Tage","5.844 Tage","6.500 Tage"], correct: 2, explain: "<strong>5.844 Tage</strong> — 16 Jahre, 4 Schaltjahre inklusive. Jeder einzelne davon war es wert, auch die Montage." },
  { q: "In welchem Jahr wurde Pia geboren?", opts: ["2007","2009","2010","2011"], correct: 2, explain: "<strong>2010</strong> — das Jahr, in dem auch das iPad erfunden wurde. Pia war von Anfang an der coolere Launch." }
];

let score = 0;
let answered = false;

function startQuiz() {
  document.getElementById('hero').style.display = 'none';
  const qs = document.getElementById('quiz');
  qs.style.display = 'block';
  buildQuestions();
  showQuestion(0);
}

function buildQuestions() {
  const c = document.getElementById('questions-container');
  c.innerHTML = '';
  const letters = ['A','B','C','D'];
  questions.forEach((q, i) => {
    const optsHtml = q.opts.map((o, j) =>
      `<button class="opt-btn" data-qidx="${i}" data-oidx="${j}" data-qidx="${i}" data-oidx="${j}">
        <span class="opt-letter">${letters[j]}</span><span>${o}</span>
      </button>`
    ).join('');
    c.innerHTML += `
      <div class="question-block" id="q${i}">
        <div class="q-card">
          <div class="q-meta">Frage ${i+1} von ${questions.length}</div>
          <div class="q-text">${q.q}</div>
          <div class="options-grid">${optsHtml}</div>
          <div class="answer-reveal" id="reveal${i}">${q.explain}</div>
          <div class="card-footer">
            <button class="next-btn" id="next${i}" data-nextidx="${i}">${i < questions.length-1 ? 'Nächste Frage →' : 'Ergebnis anzeigen →'}</button>
          </div>
        </div>
      </div>`;
  });
}

function showQuestion(idx) {
  document.querySelectorAll('.question-block').forEach(b => b.classList.remove('active'));
  document.getElementById('q'+idx).classList.add('active');
  const pct = (idx / questions.length) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = 'Frage ' + (idx+1) + ' von ' + questions.length;
  answered = false;
}

function selectOption(btn, qIdx, oIdx) {
  if (answered) return;
  answered = true;
  const q = questions[qIdx];
  const allBtns = document.querySelectorAll(`[data-qidx="${qIdx}"]`);
  allBtns.forEach(b => b.disabled = true);
  if (oIdx === q.correct) {
    btn.classList.add('correct');
    score++;
    document.getElementById('score-label').textContent = score + (score === 1 ? ' Punkt' : ' Punkte');
  } else {
    btn.classList.add('wrong');
    allBtns[q.correct].classList.add('correct');
  }
  document.getElementById('reveal'+qIdx).style.display = 'block';
  document.getElementById('next'+qIdx).style.display = 'inline-block';
}

function nextQuestion(qIdx) {
  if (qIdx < questions.length - 1) {
    showQuestion(qIdx + 1);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('quiz').style.display = 'none';
  const rs = document.getElementById('result');
  rs.style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });

  // Animated score counter
  let displayed = 0;
  const el = document.getElementById('result-score');
  const interval = setInterval(() => {
    if (displayed >= score) { clearInterval(interval); return; }
    displayed++;
    el.textContent = displayed;
  }, 120);

  // Stars
  const starsEl = document.getElementById('result-stars');
  const litStars = Math.round((score / 10) * 5);
  starsEl.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const s = document.createElement('span');
    s.className = 'star ' + (i < litStars ? 'lit' : 'dim');
    s.textContent = '★';
    starsEl.appendChild(s);
  }

  // Message
  const msgs = [
    { max: 3,  msg: "Du kennst Pia erst seit heute.",        sub: "Aber immerhin bist du hier! Das zählt auch." },
    { max: 6,  msg: "Guter Freund — aber da geht noch was.", sub: "Mit etwas mehr Aufmerksamkeit nächstes Jahr klappt es besser." },
    { max: 9,  msg: "Echter Pia-Fan!",                       sub: "Du hast gut aufgepasst. Pia ist stolz auf dich." },
    { max: 10, msg: "Perfekt! 10 von 10.",                   sub: "Entweder du bist ihre Mutter — oder ein Stalker. Beides ist irgendwie rührend." }
  ];
  const m = msgs.find(x => score <= x.max);
  document.getElementById('result-msg').textContent = m.msg;
  document.getElementById('result-sub').textContent = m.sub;

  // Confetti
  if (score >= 7) launchConfetti();
}

function restartQuiz() {
  score = 0;
  document.getElementById('result').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  document.getElementById('score-label').textContent = '0 Punkte';
  buildQuestions();
  showQuestion(0);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// === CONFETTI ===
function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const colors = ['#c4607a','#f2c4d0','#e8a0b0','#fdf6ef','#9a3f59','#f7c5d5','#fff'];
  const pieces = Array.from({ length: 120 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * -canvas.height,
    w: Math.random() * 10 + 5,
    h: Math.random() * 6 + 3,
    color: colors[Math.floor(Math.random() * colors.length)],
    rot: Math.random() * Math.PI * 2,
    rotV: (Math.random() - 0.5) * 0.12,
    vy: Math.random() * 3 + 2,
    vx: (Math.random() - 0.5) * 2
  }));
  let frame = 0;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
      p.y += p.vy; p.x += p.vx; p.rot += p.rotV;
    });
    frame++;
    if (frame < 180) requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  draw();
}

// Event delegation for dynamically built question buttons
document.getElementById('questions-container').addEventListener('click', function(e) {
  const btn = e.target.closest('.opt-btn');
  const nxt = e.target.closest('.next-btn');
  if (btn && !btn.disabled) {
    const qIdx = parseInt(btn.dataset.qidx);
    const oIdx = parseInt(btn.dataset.oidx);
    selectOption(btn, qIdx, oIdx);
  }
  if (nxt) {
    const idx = parseInt(nxt.dataset.nextidx);
    nextQuestion(idx);
  }
});

// Static button listeners
document.getElementById('start-btn-main').addEventListener('click', startQuiz);
document.getElementById('restart-btn-main').addEventListener('click', restartQuiz);

}); // DOMContentLoaded
</script>
